<body>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNavigation"><ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link active" aria-current="page" href="task0.html">Task 0</a></li><li class="nav-item"><a class="nav-link" href="task1.html">Task 1</a></li><li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li><li class="nav-item"><a class="nav-link" href="task3.html">Task 3</a></li><li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>

  </div></nav>
  <main class="container py-5"><div class="page-intro mb-4"><p class="eyebrow text-primary mb-2">Task 0</p><h1 class="display-6 fw-bold">Simple Contact Form</h1><p class="lead text-secondary">The starting point: semantic HTML controls with labels connected to every field.</p></div>
    <section class="form-shell p-4 p-md-5"><form action="#" method="post">
      <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" type="text" id="name" name="name" placeholder="Your name"><div class="form-text">Tell us who is sending the message.</div></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" name="email" placeholder="you@example.com"></div>
      <div class="mb-4"><label class="form-label" for="message">Message</label><textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here"></textarea></div>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
